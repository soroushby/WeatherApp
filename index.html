<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>WeatherNow - Real-time Weather Forecasts</title>
    <meta name="title" content="WeatherNow - Real-time Weather Forecasts" />
    <meta name="description" content="Get accurate weather forecasts, hourly updates, and 5-day predictions for any city worldwide. Track your favorite locations with WeatherNow." />

    <!-- Theme Color -->
    <meta name="theme-color" content="#0a0a0f" />
    <meta name="color-scheme" content="dark" />

    <!-- Favicon - Using emoji as SVG favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌤️</text></svg>" />

    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌤️</text></svg>" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="WeatherNow - Real-time Weather Forecasts" />
    <meta property="og:description" content="Get accurate weather forecasts, hourly updates, and 5-day predictions for any city worldwide." />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary" />
    <meta property="twitter:title" content="WeatherNow - Real-time Weather Forecasts" />
    <meta property="twitter:description" content="Get accurate weather forecasts, hourly updates, and 5-day predictions for any city worldwide." />

    <!-- Preconnect to API -->
    <link rel="preconnect" href="https://api.openweathermap.org" />

    <!-- Google Fonts - Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
